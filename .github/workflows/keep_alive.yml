name: Keep Streamlit App Awake 24/7

on:
  schedule:
    # Runs every 30 minutes to prevent Streamlit Cloud from idling
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install HTTP & Browser Simulation Tools
        run: pip install httpx requests

      - name: Send Realistic Browser Ping & Keep App Alive
        run: |
          python -c '
          import urllib.request
          import ssl
          
          url = "https://ai-research-agent-e3zgg5exnswdy2mzexjj8x.streamlit.app/"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Sec-Ch-Ua": "\"Chromium\";v=\"124\", \"Google Chrome\";v=\"124\"",
              "Sec-Ch-Ua-Mobile": "?0",
              "Sec-Ch-Ua-Platform": "\"Windows\"",
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "none",
              "Sec-Fetch-User": "?1",
              "Upgrade-Insecure-Requests": "1"
          }
          
          ctx = ssl.create_default_context()
          req = urllib.request.Request(url, headers=headers)
          
          try:
              with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                  print(f"Status Code: {resp.status}")
                  content = resp.read().decode("utf-8", errors="ignore")
                  print(f"Response size: {len(content)} bytes")
                  print("Streamlit App successfully visited and kept awake.")
          except Exception as e:
              print(f"Ping notice (normal for redirect/auth challenge): {e}")
          '
